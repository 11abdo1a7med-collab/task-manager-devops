name: CI/CD Pipeline

on:
  # التشغيل التلقائي عند الـ Push على الفروع الرئيسية
  push:
    branches: [ "main", "master" ]
  
  # التشغيل التلقائي عند الـ Pull Request
  pull_request:
    branches: [ "main", "master" ]

  # 🔵 إضافة زر التشغيل اليدوي (Run workflow) مع إمكانية اختيار البيئة
  workflow_dispatch:
    inputs:
      environment:
        description: 'اختر بيئة النشر (Deploy Environment)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      run_deploy:
        description: 'تشغيل خطوة النشر؟ (سيتم تفعيلها لاحقاً في DAY 7)'
        required: true
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  # -------------------------------------------------------------
  # PHASE 6: Build and Push Docker Images to GHCR (DAY 2)
  # -------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # -------------------------------------------------------------
  # Placeholder for Deployment (سيفشل أو يتخطى حسبDAY 2 / DAY 7)
  # -------------------------------------------------------------
  deploy:
    name: Deploy Application
    needs: build-and-push
    runs-on: ubuntu-latest
    # لن يعمل إلا إذا تم تفعيل الخيار أو عند الوصول لـ DAY 7
    if: ${{ inputs.run_deploy == true }}
    steps:
      - name: Deployment Step Placeholder
        run: |
          echo "Deploying to environment: ${{ inputs.environment || 'staging' }}"
          echo "⚠️ Deploy step is a placeholder for now (Phase 6)."
          # في DAY 7 سيتم وضع خطوات الاتصال بـ EC2/K8s والنشر هنا

      
