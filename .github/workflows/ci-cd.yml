name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:

  # ==========================================================
  # 1. TEST
  # ==========================================================
  test:
    name: Lint, Test & Security
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit

      - name: Lint with Ruff
        run: |
          ruff check app/ tests/

      - name: Run tests
        env:
          DATABASE_URL: sqlite://
        run: |
          python -m pytest -v

      - name: Security scan with Bandit
        run: |
          bandit -r app/ -ll

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================================
  # 2. BUILD & PUSH DOCKER IMAGE
  # ==========================================================
  build-and-push:
    name: Build & Push Docker Image
    needs: test

    # Build image only on push/manual execution.
    # Pull requests only run tests.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # ======================================================
      # Trivy temporarily disabled
      # ======================================================
      # - name: Scan image with Trivy
      #   uses: aquasecurity/trivy-action@v0.35.0
      #   with:
      #     image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      #     severity: CRITICAL,HIGH
      #     exit-code: "1"


  # ==========================================================
  # 3. DEPLOY TO KUBERNETES
  # ==========================================================
  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read

    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      # ------------------------------------------------------
      # Setup kubeconfig
      # ------------------------------------------------------
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube

          echo "${{ secrets.KUBECONFIG }}" | base64 --decode > ~/.kube/config

          chmod 600 ~/.kube/config

      # ------------------------------------------------------
      # Test Kubernetes connection
      # ------------------------------------------------------
      - name: Verify Kubernetes connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ------------------------------------------------------
      # Install Helm
      # ------------------------------------------------------
      - name: Install Helm
        uses: azure/setup-helm@v4

      # ------------------------------------------------------
      # Verify Helm
      # ------------------------------------------------------
      - name: Verify Helm
        run: |
          helm version
          helm lint ./helm/task-manager

      # ------------------------------------------------------
      # Deploy application
      # ------------------------------------------------------
      - name: Deploy with Helm
        run: |
          helm upgrade --install task-manager ./helm/task-manager \
            --namespace task-manager \
            --create-namespace \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=sha-${{ github.sha }} \
            --set secrets.databaseUrl="${{ secrets.DATABASE_URL }}" \
            --wait \
            --timeout 120s

      # ------------------------------------------------------
      # Verify deployment
      # ------------------------------------------------------
      - name: Verify deployment
        run: |
        
          kubectl -n task-manager rollout status deploy/task-manager-api
          kubectl -n task-manager get pods
          kubectl -n task-manager get deployments
          kubectl -n task-manager get services

          kubectl -n task-manager rollout status \
            deployment/task-manager-task-manager \
            --timeout=120s