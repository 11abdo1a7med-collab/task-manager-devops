name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "feature/docker-setup" ]
  pull_request:
    branches: [ "main", "feature/docker-setup" ]

jobs:
  test-and-lint:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: taskdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Ruff (Linter)
        run: ruff check .

      - name: Run Bandit (Security Check)
        run: bandit -r app/

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/taskdb
        run: pytest

  docker-build:
    name: Docker Image Build Test
    needs: test-and-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t task-manager-api:${{ github.sha }} .